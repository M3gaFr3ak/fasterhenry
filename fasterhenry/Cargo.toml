[package]
name = "fasterhenry"
description = "Clean-room PEEC inductance/resistance extraction for 3-D conductor geometries — FastHenry's problem class, none of its code"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/fasterhenry"
readme = "README.md"
keywords = ["peec", "inductance", "electromagnetics", "eda", "simd"]
categories = ["science", "simulation"]
# Allowlist, not a denylist: the published tarball carries the sources and the
# three documents below, nothing else (no fixtures, oracle/venv files, or repo
# tooling). LICENSE and CHANGELOG.md are symlinks to the workspace root; cargo
# packages the file they point at.
include = ["src/**/*.rs", "README.md", "LICENSE", "CHANGELOG.md"]

[lib]
# Criterion owns `cargo bench`; the default libtest harness rejects its flags.
bench = false

[dependencies]
nalgebra = { workspace = true }
faer = { workspace = true }
wide = { workspace = true }
rayon = { workspace = true }
num-complex = { workspace = true }
rustfft = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "kernels"
harness = false

[[bench]]
name = "assembly"
harness = false

[[bench]]
name = "solve"
harness = false

[[bench]]
name = "pfft"
harness = false

[[bench]]
name = "scaling"
harness = false
