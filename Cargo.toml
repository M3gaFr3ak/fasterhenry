[workspace]
resolver = "2"
members = ["fasterhenry", "fasterhenry-cli"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/2AMLogic/fasterhenry"
rust-version = "1.85"

[workspace.dependencies]
# The library, as the CLI depends on it. `path` is what the workspace builds
# against; `version` is what `cargo publish` writes into the packaged CLI
# manifest (a path-only dependency is rejected). Cargo cannot inherit this from
# `workspace.package.version`, so bump the two together.
fasterhenry = { path = "fasterhenry", version = "0.1.1" }
nalgebra = { version = "0.34", features = ["serde-serialize"] }
faer = "0.24"
wide = "0.7"
rayon = "1"
num-complex = "0.4"
# Pure-Rust FFT (MIT OR Apache-2.0, no C dependencies) for the pFFT
# far-field convolution.
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
codegen-units = 1
lto = "fat"
